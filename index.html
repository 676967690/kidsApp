<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1crAPP - Clock Master</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <h1>⏰ 1crAPP</h1>
            <div class="settings-bar">
                <button id="themeToggle" class="btn-small">🌙 Dark</button>
                <button id="formatToggle" class="btn-small">12H / 24H</button>
            </div>
        </header>

        <!-- Main Menu -->
        <div id="mainMenu" class="screen active">
            <div class="menu-card">
                <h2>Select Mode</h2>
                <button class="btn-primary" onclick="game.startLearningMode()">🎓 Learning Mode</button>
                <button class="btn-primary" onclick="game.startCompetitionMode()">🏆 Competition Mode</button>
                <div class="difficulty-select" id="difficultySelect" style="display:none; margin-top: 15px;">
                    <label>Difficulty:</label>
                    <select id="difficultyLevel">
                        <option value="easy">Easy (Hours & Minutes)</option>
                        <option value="medium">Medium (With Seconds)</option>
                        <option value="hard">Hard (Random & Fast)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-info">
                <span id="modeDisplay">Mode: Learning</span>
                <span id="roundDisplay">Round: 1/10</span>
                <span id="timerDisplay" style="display:none;">Time: 30s</span>
                <span id="scoreDisplay">Score: 0</span>
            </div>

            <div class="clock-wrapper">
                <canvas id="clockCanvas" width="320" height="320"></canvas>
                
                <div class="ampm-indicator-container">
                    <canvas id="skyCanvas" width="200" height="200"></canvas>
                    <div class="direction-label label-e">E</div>
                    <div class="direction-label label-w">W</div>
                    <div id="celestialBody" class="celestial-body">☀️</div>
                </div>
            </div>

            <div id="targetInstruction" class="instruction">Set the clock to:</div>

            <!-- Slider Input Area -->
            <div class="input-area">
                <div class="roller-group">
                    <div class="roller-label">HH</div>
                    <div class="roller-window" id="hourRoller">
                        <div class="roller-highlight"></div>
                        <div class="roller-track"></div>
                    </div>
                </div>
                
                <div class="separator">:</div>

                <div class="roller-group">
                    <div class="roller-label">MM</div>
                    <div class="roller-window" id="minuteRoller">
                        <div class="roller-highlight"></div>
                        <div class="roller-track"></div>
                    </div>
                </div>

                <div class="roller-group" id="ampmGroup" style="display:none;">
                    <div class="roller-label">AM/PM</div>
                    <div class="roller-window" id="ampmRoller">
                        <div class="roller-highlight"></div>
                        <div class="roller-track"></div>
                    </div>
                </div>
            </div>
            <p class="hint">Drag up/down or use mouse wheel</p>

            <div class="controls">
                <button id="checkBtn" class="btn-success">Check Answer</button>
                <button id="nextBtn" class="btn-primary" style="display:none;">Next Round</button>
                <button id="quitBtn" class="btn-danger">Quit</button>
            </div>
            
            <div id="feedback" class="feedback"></div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <div class="menu-card">
                <h2>Game Over!</h2>
                <p class="final-score">Final Score: <span id="finalScoreVal">0</span></p>
                <p>Correct: <span id="correctCount">0</span>/10</p>
                <button class="btn-primary" onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
